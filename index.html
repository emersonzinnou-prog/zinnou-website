<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Name | Broker</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      text-align: center;
    }

    header {
      background: #003366;
      color: white;
      padding: 20px;
    }

    .hero {
      padding: 60px 20px;
    }

    .button {
      background: #0077cc;
      color: white;
      padding: 12px 20px;
      text-decoration: none;
      border-radius: 5px;
      display: inline-block;
      margin-top: 20px;
    }

    footer {
      background: #f2f2f2;
      padding: 20px;
      margin-top: 40px;
    }

    /* Mobile responsive adjustment */
    @media (max-width: 600px) {
      .hero {
        padding: 40px 10px;
      }
    }
  </style>
</head>
<body>

<header>
  <h1>Your Name</h1>
  <p>Licensed Broker</p>
</header>

<div class="hero">
  <h2>I help clients succeed</h2>
  <p>Serving [Your City]</p>
  <a class="button" href="tel:+15551234567">Call Me</a>
</div>

<footer>
  <p>Email: your@email.com</p>
</footer>

</body>
</html>
